<style>
:root{--pk:#ff2d95;--cy:#00e5ff;--yl:#ffe600;--lm:#a6ff00;--bg:#14002e;--ink:#000;--tx:#fff;--f1:"Bungee",Impact,sans-serif;--f2:"Rubik",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 20% 0,#4b0a7a,transparent 50%),radial-gradient(circle at 90% 100%,#00506a,transparent 45%),var(--bg);color:var(--tx);font:500 16px/1.4 var(--f2);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);z-index:9}
body.danger::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 20px rgba(255,0,60,.55);animation:pl 1s infinite;z-index:8}
@keyframes pl{50%{opacity:.25}}
#app{max-width:860px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:var(--f1);font-weight:400;margin:0}
h1{font-size:clamp(2rem,8vw,3.6rem);color:var(--yl);text-shadow:4px 4px 0 var(--pk),8px 8px 0 #000;transform:skew(-6deg) rotate(-2deg);line-height:1}
.sub{color:var(--cy);font-family:var(--f1);letter-spacing:.08em;margin:10px 0 18px}
.box{background:#1d0b3d;border:4px solid #000;box-shadow:6px 6px 0 #000;border-radius:6px;padding:14px;margin-bottom:16px}
button{font:inherit;color:#fff;cursor:pointer}
.btn{font-family:var(--f1);font-size:1.1rem;background:var(--pk);border:4px solid #000;box-shadow:5px 5px 0 #000;padding:.6em 1.2em;border-radius:4px;transition:transform .08s}
.btn:hover{transform:translate(-2px,-2px) skew(-3deg)}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.btn.cy{background:var(--cy);color:#000}.btn.yl{background:var(--yl);color:#000}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.chip{font-weight:700;background:#2a1257;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:.4em .8em;border-radius:4px}
.chip.on{background:var(--lm);color:#000}
input{font:inherit;width:100%;padding:.6em;border:4px solid #000;border-radius:4px;background:#fff;color:#000;user-select:text}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f1);margin-bottom:10px}
.hud span{background:#000;padding:.3em .7em;border-radius:4px}
.tag{display:inline-block;background:var(--yl);color:#000;font:700 .75rem var(--f2);padding:.15em .6em;border:2px solid #000;margin-bottom:8px}
.qbox h2{font-size:clamp(1.1rem,3.6vw,1.6rem);line-height:1.3}
.bar{position:relative;height:30px;background:#000;border:4px solid #000;border-radius:4px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lm),var(--cy));width:100%}
.bar b{position:absolute;inset:0;text-align:center;font:400 1rem/22px var(--f1)}
.bar.low{animation:sh .25s infinite}.bar.low i{background:#ff1744}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;background:#2d1a6b;border:4px solid #000;box-shadow:5px 5px 0 #000;padding:.8em 1em;border-radius:4px;font-weight:700}
.opt:hover:not(:disabled){background:var(--pk);transform:translate(-2px,-2px)}
.opt.ok{background:var(--lm);color:#000}.opt.no{background:#ff1744}.opt.rev{outline:4px dashed var(--yl)}.opt.rem{opacity:.2;text-decoration:line-through}
.opt:disabled{cursor:default}
.hand{margin-top:16px}.hand small{font-family:var(--f1);color:var(--cy)}
.mini{display:inline-flex;gap:6px;align-items:center;background:#000;border:3px solid;border-radius:4px;padding:.35em .7em;margin:4px 6px 0 0;font-size:.85rem}
.mini:disabled{opacity:.35;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,230px));justify-content:center;gap:18px}
@media(max-width:700px){.cards{grid-template-columns:1fr}}
.card{display:block;width:100%;aspect-ratio:5/7;max-width:240px;justify-self:center;padding:0;border:0;background:none;perspective:900px;transition:transform .15s;animation:rise .75s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:calc(var(--i)*.14s)}
.fl{position:relative;height:100%}
.ff{position:absolute;inset:0;transform:scaleX(0);animation:fin .4s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:calc(1.3s + var(--i)*.6s)}
.cf,.cb{position:absolute;inset:0;border-radius:8px;border:5px solid #000;box-shadow:6px 6px 0 #000}
.cf{background:#120824;padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px}
.cb{animation:fout .3s ease-in forwards;animation-delay:calc(1s + var(--i)*.6s);background:repeating-linear-gradient(45deg,var(--pk) 0 12px,#14002e 12px 24px);display:grid;place-items:center;font:400 3.4rem var(--f1);color:var(--yl);text-shadow:3px 3px 0 #000}
.card:hover{transform:translateY(-6px) rotate(-1deg)}
.ct{display:flex;justify-content:space-between;font:700 .72rem var(--f2)}
.ic{font-size:3rem;margin:4px 0}.card h3{font-size:1rem}.card p{margin:0;font-size:.9rem;flex:1}.card small{color:#bbb}
.r-c{border-color:#b0bec5}.r-r{border-color:var(--cy)}.r-e{border-color:#c25bff}.r-l{border-color:var(--yl);animation:gl 1.2s infinite alternate}
@keyframes gl{to{box-shadow:6px 6px 0 #000,0 0 24px var(--yl)}}
.pres{display:flex;gap:14px;align-items:flex-end}
.pres img{width:120px;image-rendering:pixelated;border:4px solid #000;background:#222;flex:none}
.bub{background:#fff;color:#000;border:4px solid #000;border-radius:14px;padding:12px 14px;font-weight:700;position:relative}
.big{font:400 clamp(2rem,9vw,3.4rem) var(--f1);color:var(--lm);text-shadow:3px 3px 0 #000}
table{width:100%;border-collapse:collapse}td{padding:4px 6px;border-bottom:1px solid #4a2a8a}
.fb{font-family:var(--f1);margin-top:12px;min-height:1.5em;color:var(--yl)}
#app{padding-bottom:130px}
#pr{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:8px;z-index:20;pointer-events:none;transform:translateY(170%);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#pr.on{transform:none}
#pr img{width:84px;image-rendering:pixelated;border:4px solid #000;background:#222;box-shadow:4px 4px 0 #000;animation:bob .5s infinite alternate}
#pr .bub{max-width:min(62vw,280px);font-size:.95rem;margin-bottom:14px}
@keyframes bob{to{transform:translateY(-6px) rotate(2deg)}}
@keyframes rise{from{transform:translateY(110vh) rotate(10deg)}}
@keyframes fout{to{transform:scaleX(0)}}@keyframes fin{to{transform:scaleX(1)}}
@keyframes fall{to{transform:translateY(70vh) rotate(14deg);opacity:0}}
@keyframes pick{35%{transform:scale(1.18) rotate(-4deg)}to{transform:scale(1.6) translateY(-60px);opacity:0;filter:brightness(2)}}
.cards.sel .card:not(.pk){animation:fall .5s ease-in forwards}.card.pk{animation:pick .65s ease-in forwards}
@keyframes up{from{opacity:0;transform:translateY(30px) scale(.96)}}
@keyframes sl{from{opacity:0;transform:translateX(-70px)}}@keyframes sr{from{opacity:0;transform:translateX(70px)}}
#app.an>*:not(h1):not(.cards):not(.gm){animation-name:up;animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.9,.3,1.2);animation-fill-mode:backwards}
#app.an>:nth-child(2){animation-delay:.08s}#app.an>:nth-child(3){animation-delay:.16s}#app.an>:nth-child(4){animation-delay:.24s}#app.an>:nth-child(5){animation-delay:.32s}#app.an>:nth-child(6){animation-delay:.4s}
#app.an .opt:nth-child(odd){animation:sl .4s backwards}#app.an .opt:nth-child(even){animation:sr .4s backwards}
#app.an .opt:nth-child(1){animation-delay:.25s}#app.an .opt:nth-child(2){animation-delay:.33s}#app.an .opt:nth-child(3){animation-delay:.41s}#app.an .opt:nth-child(4){animation-delay:.49s}
.opt.ok{animation:okp .5s}.opt.no{animation:sh .1s 4}@keyframes okp{40%{transform:scale(1.07) rotate(-1deg);box-shadow:0 0 30px var(--lm)}}
#app.shk{animation:sh .12s 3}.hud span.bump{animation:bump .45s}@keyframes bump{50%{transform:scale(1.45);color:var(--lm)}}
h1{animation:logo 2.6s ease-in-out infinite}@keyframes logo{0%,100%{transform:skew(-6deg) rotate(-2deg)}50%{transform:skew(-4deg) rotate(1deg) scale(1.04)}}
#go{animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(1.07) skew(-3deg)}}
.chip{transition:transform .1s,background .12s}.chip:hover{transform:translate(-2px,-2px) rotate(-1.5deg)}
.chip:hover,.chip.on{background:var(--cc,var(--lm));color:#000}
.chip[data-k=r][data-v=c]{--cc:#cfd8dc}.chip[data-k=r][data-v=r]{--cc:#2fb4ff}.chip[data-k=r][data-v=e]{--cc:#c25bff}.chip[data-k=r][data-v=l]{--cc:#ffd21a}
#df .chip:nth-child(1){--cc:#3ddc6b}#df .chip:nth-child(2){--cc:#ffe600}#df .chip:nth-child(3){--cc:#ff3b4f}
.pres img{animation:bob .6s infinite alternate}
#app>:not(.gm){max-width:860px;margin-left:auto;margin-right:auto}
.gm{display:block}
.cs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;align-items:stretch}
.side{display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px;padding:10px;min-height:250px;background:rgba(0,0,0,.25);border:3px dashed #4a2a8a;border-radius:10px}.side>small{flex:0 0 100%;font-family:var(--f1);color:var(--cy)}.side>em{color:#999;font-size:.8rem}
.fc,.mc{border-width:4px;border-style:solid;border-radius:8px;box-shadow:4px 4px 0 #000;background:#120824;text-align:center}
.fc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;width:132px;aspect-ratio:5/7;font-size:.78rem;border-radius:12px;overflow:hidden}.fc .ct{width:100%;display:flex;justify-content:space-between;font-size:.56rem}.fc .ic{font-size:2.2rem;margin:2px 0}.fc h3{font-size:.76rem;line-height:1.1}.fc p{font-size:.64rem;line-height:1.2;margin:0;flex:1;overflow:hidden}.fc small{font-size:.5rem;color:#aaa}.fc:disabled{opacity:.45;cursor:not-allowed}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.mc{aspect-ratio:5/7;padding:8px;display:flex;flex-direction:column;justify-content:center;gap:4px}.mc b{font-size:.65rem}.mc .ic{font-size:2.4rem;margin:0}.mc h3{font-size:.8rem}.mc:hover{transform:translateY(-4px) rotate(-1deg)}
.mc.lk{border-color:#000;background:repeating-linear-gradient(45deg,var(--pk) 0 12px,#14002e 12px 24px);opacity:.4;filter:brightness(.5);font:400 2.6rem var(--f1);color:var(--yl);align-items:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;z-index:30;animation:up .25s}
.dc{position:relative;inset:auto;width:min(78vw,300px);aspect-ratio:5/7;gap:12px;font-size:1.05rem;align-items:center;justify-content:center}.dc .ic{font-size:6rem}.dc h3{font-size:1.5rem}
#app.an .mid>*{animation:up .5s backwards}#app.an .mid>:nth-child(2){animation-delay:.08s}#app.an .mid>:nth-child(3){animation-delay:.16s}#app.an .mid>:nth-child(4){animation-delay:.24s}#app.an .mid>:nth-child(5){animation-delay:.32s}
.qt{font-family:var(--f1);background:#ff1744;color:#fff;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:.3em .7em;border-radius:4px}.qt:hover{background:var(--pk)}
button.fc:hover:not(:disabled){transform:translateY(-6px) rotate(-1.5deg)}
#app.an .cs{animation:up .5s .35s backwards}#app.an .fc{animation:cpop .4s .5s backwards}@keyframes cpop{from{transform:scale(.6) rotate(-8deg);opacity:0}}
@media(max-width:560px){.fc{width:104px}.fc p{font-size:.56rem}.fc .ic{font-size:1.8rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
