name: esteira-jogo
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esteira-${{ github.ref }}
  cancel-in-progress: false # nunca interromper um deploy no meio

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks precisa do histórico
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci # valida o JSON, roda unidade+integração, cobertura e JUnit em reports/
      - name: Segredos (gitleaks)
        run: |
          mkdir -p reports
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --report-format json --report-path reports/gitleaks.json
      - name: Dependências críticas e SBOM
        run: |
          npm audit --omit=dev --audit-level=critical
          npm sbom --sbom-format cyclonedx > reports/sbom.json
      - name: Versão (tag vX.Y.Z ou package.json)
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(node -p "require('./package.json').version"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: GDD.pdf (Pandoc)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc texlive-xetex lmodern poppler-utils
          VERSION="${{ steps.v.outputs.version }}" bash scripts/gdd.sh
      - name: Build versionado + build.zip + checksum
        run: |
          VERSION="${{ steps.v.outputs.version }}" npm run build
          (cd dist && zip -qr ../build.zip .)
          sha256sum build.zip > build.zip.sha256
          mkdir -p reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ github.sha }}
          path: |
            build.zip
            build.zip.sha256
            docs/GDD.pdf
            reports/
          if-no-files-found: ignore

  deploy-hml:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # escrever no branch gh-pages
    environment:
      name: homologacao
      url: ${{ vars.SITE_URL }}/hml/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
      - name: Publicar em /hml/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publicar.sh hml build.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aguardar o Pages e rodar a regressão E2E em homologação
        run: |
          for i in $(seq 1 40); do
            v=$(curl -fsS "${{ vars.SITE_URL }}/hml/version.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).sha" 2>/dev/null || true)
            [ "$v" = "${GITHUB_SHA::7}" ] && break; sleep 15
          done
          npm ci && npx playwright install --with-deps chromium
          BASE_URL="${{ vars.SITE_URL }}/hml/" npx playwright test


  release:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
      - name: GitHub Release (build, checksum, SBOM e GDD) com notas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="build.zip build.zip.sha256 docs/GDD.pdf"
          [ -f reports/sbom.json ] && FILES="$FILES reports/sbom.json"
          gh release create "$GITHUB_REF_NAME" $FILES --repo "$GITHUB_REPOSITORY" --generate-notes # revise as notas depois

