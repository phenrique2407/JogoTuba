<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHOW DO BITLHÃO</title>
<body style="background:#14002e;color:#fff;font:18px system-ui;text-align:center;padding-top:20vh">Carregando o jogo…</body>
<script>
// Carregador: lê o rollout.json e leva o jogador para a release certa (canário ou estável).
fetch("rollout.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((r) => {
    let v = null;
    try { v = localStorage.getItem("versao"); } catch (e) {}
    const validas = [r.estavel, r.canario].filter(Boolean);
    if (!validas.includes(v)) { // sessão nova ou versão retirada (rollback)
      v = r.canario && Math.random() * 100 < r.percentual ? r.canario : r.estavel;
      try { localStorage.setItem("versao", v); } catch (e) {}
    }
    if (!v) throw new Error("sem versão");
    location.replace("releases/" + v + "/");
  })
  .catch(() => { document.body.textContent = "Jogo indisponível no momento."; });
</script>
</html>
